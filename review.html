<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Review Booking — Pro Car</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-dark text-light">
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary mb-4"
    >
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html"
          ><span class="text-warning">Pro</span>Car</a
        >
        <button
          type="button"
          class="btn btn-outline-light btn-sm float-end"
          onclick="refreshPage()"
          title="Refresh review"
          aria-label="Refresh review"
        >
          ↻
        </button>
      </div>
    </nav>

    <div class="container py-4">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card review-card border-secondary">
            <div class="card-body">
              <h2 class="h4 text-warning mb-3">Review Your Booking</h2>
              <p class="text-white mb-4">
                Please confirm the details below before sending your request to
                the admin.
              </p>
              <div id="review-summary" class="review-summary mb-4"></div>
              <div class="d-flex gap-2 flex-wrap">
                <a href="dashboard.html" class="btn btn-outline-light"
                  >Back to Dashboard</a
                >
                <button
                  id="confirm-booking-btn"
                  class="btn btn-warning text-dark fw-semibold"
                >
                  Send to Admin
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="js/api.js?v=20260721"></script>
    <script src="js/review.js"></script>
    <script>
      const API =
        window.API || window.getApiBase?.() || "http://127.0.0.1:80/backend";
      const reviewSummary = document.getElementById("review-summary");
      const confirmBtn = document.getElementById("confirm-booking-btn");

      function getDraft() {
        try {
          return JSON.parse(
            localStorage.getItem("bookingReviewDraft") || "null",
          );
        } catch (error) {
          return null;
        }
      }

      function renderDraft() {
        const draft = getDraft();
        reviewSummary.innerHTML = buildBookingSummary(draft);
      }

      async function submitBooking() {
        const draft = getDraft();
        if (!draft) {
          alert("No booking details were found. Please start over.");
          window.location.href = "dashboard.html";
          return;
        }

        const user = JSON.parse(localStorage.getItem("user") || "{}");
        const payload = buildBookingPayload({
          ...draft,
          userId: user.id || draft.userId,
        });

        confirmBtn.disabled = true;
        confirmBtn.textContent = "Submitting...";

        try {
          const response = await fetch(`${API}/bookings.php`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          if (!response.ok) {
            throw new Error(`Request failed: ${response.status}`);
          }

          localStorage.removeItem("bookingReviewDraft");
          localStorage.setItem("procar-booking-created", "1");
          alert("Your booking request was sent to the admin.");
          window.location.replace("dashboard.html?refresh=1");
        } catch (error) {
          console.error(error);
          alert("Unable to submit the booking right now. Please try again.");
          confirmBtn.disabled = false;
          confirmBtn.textContent = "Send to Admin";
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        renderDraft();
        confirmBtn.addEventListener("click", submitBooking);
      });
    </script>
  </body>
</html>
