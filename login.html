<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign In — Pro Car</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="bg-dark text-light">
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <a
            class="navbar-brand fw-bold d-inline-block mb-5"
            href="../index.html"
            ><span class="text-warning">Pro</span>Car</a
          >
          <button
            type="button"
            class="btn btn-outline-light btn-sm float-end"
            onclick="refreshPage()"
            title="Refresh sign in"
            aria-label="Refresh sign in"
          >
            ↻
          </button>
          <div class="card">
            <div class="card-body p-4 p-lg-5">
              <span class="badge bg-warning text-dark mb-3">Welcome back</span>
              <h1 class="h2 mb-2">Sign in to Pro Car</h1>
              <p class="text-secondary mb-4">
                Manage bookings and find your next drive.
              </p>
              <div id="auth-message"></div>
              <form id="login-form">
                <label class="form-label" for="email">Email</label
                ><input
                  class="form-control bg-dark text-light mb-3"
                  id="email"
                  type="email"
                  required
                  autocomplete="email"
                /><label class="form-label" for="password">Password</label
                ><input
                  class="form-control bg-dark text-light mb-4"
                  id="password"
                  type="password"
                  required
                  autocomplete="current-password"
                /><button
                  class="btn btn-warning text-dark fw-semibold w-100"
                  type="submit"
                >
                  Sign in
                </button>
              </form>
              <p class="text-secondary mt-4 mb-0">
                New to Pro Car?
                <a class="text-warning" href="register.html"
                  >Create an account</a
                >
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
